<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AJAX</title>
    <link rel="stylesheet" href="./18_ajax.css" />
    <script src="https://cdn.jsdelivr.net/npm/axios@1.20.0/dist/axios.min.js"></script>
    <script src="./18_ajax.js" defer></script>
  </head>
  <body>
    <div class="wrap">
      <form class="search">
        <input
          type="number"
          name="page"
          id="page"
          placeholder="Page"
          required
          minlength="0"
        />
        <input
          type="number"
          name="limit"
          id="limit"
          placeholder="Limit"
          required
          minlength="0"
        />
        <button type="submit">Search</button>
      </form>
      <div class="card-container">
        <h3>Insert page and limit</h3>
      </div>
    </div>
  </body>
</html>
